spring.application.name=automanager
server.port=${PORT:8081}
# Links HATEOAS usam o host da requisição. Atrás de proxy confiável, defina FORWARD_HEADERS_STRATEGY=framework.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./dados/automanager;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
